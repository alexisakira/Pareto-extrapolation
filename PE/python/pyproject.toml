[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pareto-extrapolation"
version = "0.1.0"
description = "Pareto extrapolation for stationary distributions with heavy upper tails"
requires-python = ">=3.10"
authors = [
    {name = "Alexis Akira Toda", email = "alexis.akira.toda@emory.edu"},
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
example = ["matplotlib>=3.8"]
test = ["pytest>=8"]

[tool.setuptools.package-data]
pareto_extrapolation = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
